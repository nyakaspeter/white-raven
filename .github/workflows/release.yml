name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing_tag="$(git tag --points-at "$GITHUB_SHA" --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          previous_tag="$(git tag --sort=-version:refname | awk -v current="$existing_tag" '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && $0 != current { print; exit }')"

          if [[ -n "$existing_tag" ]] && gh release view "$existing_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            echo "Commit already has published release $existing_tag."
            exit 0
          fi

          if [[ -n "$existing_tag" ]]; then
            version="${existing_tag#v}"
          else
            version="$(bash .github/scripts/next-version.sh)"
          fi

          if [[ -z "$version" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No Conventional Commits found since the previous release."
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "Preparing v$version."

      - name: Set up Go
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build rootless widget
        if: steps.version.outputs.release == 'true'
        run: go run ./build rootless -version "${{ steps.version.outputs.version }}"

      - name: Build rooted widget
        if: steps.version.outputs.release == 'true'
        run: go run ./build rooted -version "${{ steps.version.outputs.version }}"

      - name: Publish GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        shell: bash
        run: |
          notes_arguments=(--generate-notes)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            notes_arguments+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          gh release create "$RELEASE_TAG" \
            "build/whiteraven-rootless-${RELEASE_VERSION}.zip" \
            "build/whiteraven-${RELEASE_VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            "${notes_arguments[@]}"
